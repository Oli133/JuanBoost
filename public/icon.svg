<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Gaming Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="6" stroke-dasharray="24 16" />
  <circle cx="256" cy="256" r="160" fill="url(#shieldGrad)" stroke="#334155" stroke-width="4" />

  <!-- Accent glow arc -->
  <path d="M 120 256 A 136 136 0 0 1 392 256" fill="none" stroke="url(#neonGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central High-Impact Lightning Bolt -->
  <polygon points="275,105 175,265 245,265 235,405 345,235 275,235" fill="url(#neonGrad)" filter="url(#glow)" />
  <polygon points="275,115 185,260 248,260 238,390 335,240 275,240" fill="#ffffff" opacity="0.85" />

  <!-- Corner Tech Accents -->
  <line x1="80" y1="80" x2="110" y2="80" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="80" x2="80" y2="110" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />

  <line x1="432" y1="80" x2="402" y2="80" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <line x1="432" y1="80" x2="432" y2="110" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />

  <line x1="80" y1="432" x2="110" y2="432" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="432" x2="80" y2="402" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />

  <line x1="432" y1="432" x2="402" y2="432" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <line x1="432" y1="432" x2="432" y2="402" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
</svg>
